name: SkyWatch CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "ruff.toml"
      - "pytest.ini"
      - "helm/**"
      - "!helm/skywatch/values-gitops.yaml"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "ruff.toml"
      - "pytest.ini"
      - "helm/**"
      - "!helm/skywatch/values-gitops.yaml"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: skywatch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      application: ${{ steps.filter.outputs.application }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application:
              - 'app/**'
              - 'tests/**'
              - 'requirements-dev.txt'
              - 'ruff.toml'
              - 'pytest.ini'

  validate:
    name: Lint, Test and Validate Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/frontend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install \
            -r app/backend/requirements.txt \
            -r app/frontend/requirements.txt \
            pytest \
            ruff

      - name: Ruff lint
        run: ruff check app tests

      - name: Run automated tests
        run: python -m pytest -q

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Validate Helm chart
        run: |
          helm lint helm/skywatch \
            --strict \
            --set backend.image.tag=a3f8c91 \
            --set frontend.image.tag=a3f8c91

      - name: Verify Helm rendering
        run: |
          helm template skywatch-dev helm/skywatch \
            --set backend.image.tag=a3f8c91 \
            --set frontend.image.tag=a3f8c91 \
            > /tmp/skywatch-rendered.yaml

  build-and-scan:
    name: Build and Scan (${{ matrix.component }})
    needs:
      - changes
      - validate
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: image
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app/${{ matrix.component }}
          platforms: linux/amd64
          load: true
          push: false
          tags: skywatch-${{ matrix.component }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skywatch-${{ matrix.component }}:${{ steps.image.outputs.tag }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Export scanned Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker save \
            skywatch-${{ matrix.component }}:${{ steps.image.outputs.tag }} \
            | gzip > /tmp/skywatch-${{ matrix.component }}.tar.gz

      - name: Upload scanned image artifact
        uses: actions/upload-artifact@v4
        with:
          name: skywatch-${{ matrix.component }}-image
          path: /tmp/skywatch-${{ matrix.component }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Images to GHCR
    needs:
      - validate
      - build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: skywatch-*-image
          merge-multiple: true
          path: /tmp/skywatch-images

      - name: Load scanned Docker images
        shell: bash
        run: |
          set -euo pipefail

          for image in /tmp/skywatch-images/*.tar.gz; do
            docker load -i "$image"
          done

      - name: Determine image tag
        id: image
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend and frontend images
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          OWNER="${IMAGE_OWNER,,}"

          for component in backend frontend; do
            LOCAL_IMAGE="skywatch-${component}:${IMAGE_TAG}"
            REMOTE_IMAGE="ghcr.io/${OWNER}/skywatch-${component}:${IMAGE_TAG}"

            docker image inspect "$LOCAL_IMAGE" > /dev/null
            docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
            docker push "$REMOTE_IMAGE"

            echo "Published: $REMOTE_IMAGE"
          done

  update-gitops:
    name: Update GitOps Image Tags
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Update image tags
        shell: bash
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TAG="${IMAGE_SHA:0:7}"

          cat > helm/skywatch/values-gitops.yaml <<EOF2
          # Managed by GitHub Actions after successful image publishing.
          # Do not manually set image tags to unpublished versions.

          backend:
            image:
              tag: "${TAG}"

          frontend:
            image:
              tag: "${TAG}"
          EOF2

          cat helm/skywatch/values-gitops.yaml

      - name: Commit and push GitOps update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/skywatch/values-gitops.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes."
            exit 0
          fi

          git commit -m "ci: update SkyWatch image tags [skip ci]"
          git push origin HEAD:main
