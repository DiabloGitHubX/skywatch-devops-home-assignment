apiVersion: v1
kind: Service
metadata:
  name: {{ include "skywatch.frontend.fullname" . }}
  labels:
    {{- include "skywatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "skywatch.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}