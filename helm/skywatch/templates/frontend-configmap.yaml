apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skywatch.frontend.fullname" . }}-config
  labels:
    {{- include "skywatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  BACKEND_URL: {{ printf "http://%s:%v" (include "skywatch.backend.fullname" .) .Values.backend.service.port | quote }}