---
- name: Validate required K3s configuration
  ansible.builtin.assert:
    that:
      - k3s_node_ip is defined
      - k3s_node_ip | default('') | length > 0
    fail_msg: >-
      A valid k3s_node_ip must be supplied by the generated inventory.

- name: Verify discovered IP belongs to the master
  ansible.builtin.assert:
    that:
      - k3s_node_ip in ansible_all_ipv4_addresses
    fail_msg: >-
      The configured K3s node IP {{ k3s_node_ip }}
      does not belong to this master.
      Detected addresses: {{ ansible_all_ipv4_addresses }}

- name: Check K3s service definition
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_service

- name: Check K3s binary
  ansible.builtin.stat:
    path: "{{ k3s_binary_path }}"
  register: k3s_server_binary

- name: Reject incomplete K3s installation
  ansible.builtin.assert:
    that:
      - k3s_server_service.stat.exists == k3s_server_binary.stat.exists
    fail_msg: >-
      Incomplete K3s installation detected.
      The service and binary must either both exist or both be absent.
      Manual investigation is required.

- name: Check installed K3s version
  ansible.builtin.command: "{{ k3s_binary_path }} --version"
  register: installed_k3s_version
  changed_when: false
  check_mode: false
  when: k3s_server_service.stat.exists

- name: Verify installed K3s version matches pinned version
  ansible.builtin.assert:
    that:
      - k3s_version in installed_k3s_version.stdout
    fail_msg: >-
      Installed K3s version differs from {{ k3s_version }}.
      Manual upgrade or reconciliation is required.
  when: k3s_server_service.stat.exists

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ k3s_install_script }}"
    mode: "0755"
  when: not k3s_server_service.stat.exists

- name: Install K3s control plane
  ansible.builtin.command: "{{ k3s_install_script }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --node-ip {{ k3s_node_ip }}
      --advertise-address {{ k3s_node_ip }}
      --tls-san {{ k3s_node_ip }}
      --write-kubeconfig-mode 600
      --node-taint node-role.kubernetes.io/control-plane=true:NoSchedule
      {{ k3s_disable_components | map('regex_replace', '^', '--disable ') | join(' ') }}
  when: not k3s_server_service.stat.exists

- name: Ensure K3s server service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  when: not ansible_check_mode or k3s_server_service.stat.exists

- name: Wait for Kubernetes API to become available
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ k3s_api_port }}"
    timeout: 180
  when: not ansible_check_mode or k3s_server_service.stat.exists

- name: Verify Kubernetes node readiness
  ansible.builtin.command: "{{ k3s_binary_path }} kubectl get nodes"
  register: k3s_nodes
  changed_when: false
  check_mode: false
  retries: 10
  delay: 6
  until: k3s_nodes.rc == 0
  when: not ansible_check_mode or k3s_server_service.stat.exists

- name: Display Kubernetes nodes
  ansible.builtin.debug:
    var: k3s_nodes.stdout_lines
  when: not ansible_check_mode or k3s_server_service.stat.exists
