---
- import_playbook: validate_controller.yml

- name: Configure K3s control plane
  hosts: k3s_master
  become: true

  vars_files:
    - ../group_vars/all.yml

  roles:
    - k3s_master

- name: Retrieve K3s worker join token
  hosts: k3s_master
  become: true
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Read existing K3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_file
      no_log: true
      check_mode: false

    - name: Store K3s join token for worker registration
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_node_token_file.content | b64decode | trim }}"
      no_log: true

- name: Configure K3s worker nodes
  hosts: k3s_workers
  become: true

  vars_files:
    - ../group_vars/all.yml

  roles:
    - k3s_worker
