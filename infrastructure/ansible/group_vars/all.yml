---
# Pinned K3s release for this temporary development lab.
# Kubernetes 1.29 is end-of-life and must not be used for production.
# The version is intentionally pinned for reproducibility.
k3s_version: "v1.29.15+k3s1"

# Cluster networking.
k3s_api_port: 6443

# Disable bundled components to reduce resource consumption
# and allow us to install our own ingress controller later.
k3s_disable_components:
  - traefik
  - servicelb

# K3s installation paths.
k3s_install_script: /tmp/install-k3s.sh
k3s_binary_path: /usr/local/bin/k3s

# Kubernetes configuration.
k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
